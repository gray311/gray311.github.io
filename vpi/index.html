<!doctype html><html><head><meta charset="utf-8"><title>VPI pipeline viewer</title>
<style>
:root{--bg:#0e0f13;--card:#1a1d24;--fg:#e6e6e6;--mut:#9aa0aa;--ok:#22c55e;--no:#64748b;--acc:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:14px 18px;background:#12141a;border-bottom:1px solid #262b34;position:sticky;top:0;z-index:5}
h1{margin:0 0 6px;font-size:18px}.sub{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
select,input,button{background:#0c0e12;color:var(--fg);border:1px solid #2a2f3a;border-radius:6px;padding:6px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:16px}
.card{background:var(--card);border:1px solid #262b34;border-radius:10px;overflow:hidden;cursor:pointer;transition:.1s}
.card:hover{border-color:var(--acc)}.card img{width:100%;display:block}
.meta{padding:8px 10px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.b{font-size:11px;padding:2px 7px;border-radius:20px;background:#242a35;color:#cbd5e1}
.b.gt{background:#3b2f13;color:#fbbf24}.b.win{background:#12351f;color:var(--ok)}.b.sc{background:#0e2a3a;color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:10;overflow:auto;padding:24px}
.modal.on{display:block}.sheet{max-width:1200px;margin:0 auto;background:#12141a;border:1px solid #2a2f3a;border-radius:12px;padding:18px}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stages figure{margin:0}
.stages img{width:100%;border-radius:8px;border:1px solid #2a2f3a}.cap{color:var(--mut);font-size:12px;margin:4px 2px}
.injs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.inj{background:#0c0e12;border:1px solid #232833;border-radius:8px;overflow:hidden}
.inj.win{border-color:var(--ok)}.inj img{width:100%;display:block}.inj .t{padding:7px 9px;font-size:12px}
.x{float:right;font-size:20px;color:var(--mut);cursor:pointer}.k{color:var(--mut)}
.hl{background:#161a22;border:1px solid #262b34;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px}
</style></head><body>
<header>

  <label class="k"><input type="checkbox" id="win" onchange="render()"> only successful</label>
  <span class="k" id="count"></span>
 </div>
</header>
<div class="grid" id="grid"></div>
<div class="modal" id="modal" onclick="if(event.target.id=='modal')close_()"><div class="sheet" id="sheet"></div></div>
